<!DOCTYPE html>
<html lang="bn" data-lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amar Foshol - আমার ফসল</title>
  <meta name="description" content="Amar Foshol (আমার ফসল): a bilingual (Bangla/English) demonstration tool that explains climate change and crop rotation possibilities for farmers in Bangladesh using NASA Earth observation concepts. Demo data only.">
  <meta name="theme-color" content="#006A4E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23006A4E'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F42A41'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/charts.css">
  <link rel="stylesheet" href="src/styles/rotation.css">
  <link rel="stylesheet" href="src/styles/sources.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip"></a>

  <header class="site-header">
    <div class="container">
      <div class="site-header__bar">
        <a class="brand" href="#home" data-i18n-attr="aria-label:brand.name">
          <svg class="brand__mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="8" fill="#006A4E"/><circle cx="16" cy="16" r="7" fill="#F42A41"/>
          </svg>
          <span data-i18n="brand.name"></span>
        </a>
        <nav class="site-nav" id="site-nav" data-i18n-attr="aria-label:nav.label">
          <ul id="nav-list"></ul>
        </nav>
        <div class="header-actions">
          <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label">
            <button type="button" id="lang-bn" data-set-lang="bn" aria-pressed="true" lang="bn" aria-label="বাংলা ভাষা বেছে নিন">বাংলা</button>
            <button type="button" id="lang-en" data-set-lang="en" aria-pressed="false" lang="en" aria-label="Switch to English">English</button>
          </div>
          <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="site-nav" data-i18n-attr="aria-label:nav.menuOpen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero on-dark" id="home" data-nav="nav.home" aria-labelledby="hero-title">
      <div class="container hero__grid">
        <div class="hero__text">
          <p><span class="badge badge--demo" data-i18n="demo.badge" data-i18n-real="demo.badgeReal" data-i18n-attr="title:demo.hint" data-i18n-attr-real="title:demo.hintReal"></span></p>
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <p class="hero__lead" data-i18n="hero.text"></p>
          <div class="hero__cta">
            <a class="btn btn--primary" href="#start" data-i18n="hero.ctaPrimary"></a>
            <a class="btn btn--secondary" href="#how" data-i18n="hero.ctaSecondary"></a>
          </div>
        </div>
        <svg class="hero__art" viewBox="0 0 320 210" role="img" data-i18n-attr="aria-label:hero.imageLabel" focusable="false">
          <defs>
            <clipPath id="hero-art-clip"><rect width="320" height="210" rx="16"/></clipPath>
            <g id="hero-sprout"><path d="M0 0v-9" stroke="#E4F0EA" stroke-width="2" stroke-linecap="round"/><path d="M0-6c-7-1-9-7-7-11 6 0 9 4 7 11z" fill="#9FD3BE"/><path d="M0-8c6-1 8-6 6-10-5 0-8 4-6 10z" fill="#E4F0EA"/></g>
          </defs>
          <g clip-path="url(#hero-art-clip)">
            <rect width="320" height="210" fill="#006A4E"/>
            <circle cx="268" cy="42" r="20" fill="#F42A41"/>
            <g transform="rotate(-25 70 48)">
              <rect x="58" y="40" width="24" height="16" rx="3" fill="#E4F0EA"/>
              <rect x="26" y="43" width="28" height="10" rx="2" fill="#9FD3BE"/>
              <rect x="86" y="43" width="28" height="10" rx="2" fill="#9FD3BE"/>
              <path d="M40 43v10M48 43v10M100 43v10M108 43v10" stroke="#006A4E" stroke-width="1.5"/>
            </g>
            <path d="M82 66L148 104" stroke="#E4F0EA" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" fill="none"/>
            <rect y="120" width="320" height="90" fill="#00382A"/>
            <g stroke="#2FA37F" stroke-width="3" stroke-linecap="round" fill="none">
              <path d="M160 120L-30 210M160 120L30 210M160 120L100 210M160 120L160 210M160 120L220 210M160 120L290 210M160 120L350 210"/>
            </g>
            <use href="#hero-sprout" x="128" y="140"/><use href="#hero-sprout" x="192" y="140"/>
            <use href="#hero-sprout" x="96" y="166"/><use href="#hero-sprout" x="224" y="166"/>
            <use href="#hero-sprout" x="52" y="196"/><use href="#hero-sprout" x="268" y="196"/>
            <path d="M160 112v42" stroke="#E4F0EA" stroke-width="3" stroke-linecap="round"/>
            <rect x="148" y="96" width="24" height="16" rx="3" fill="#E4F0EA"/>
            <circle cx="160" cy="104" r="3.5" fill="#F42A41"/>
            <path d="M149 90a16 16 0 0 1 22 0M143 84a25 25 0 0 1 34 0" stroke="#E4F0EA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
      </div>
    </section>

    <section class="section" id="how" aria-labelledby="how-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="how.eyebrow"></span>
          <h2 id="how-title" data-i18n="how.title"></h2>
          <p class="section__lead" data-i18n="how.lead"></p>
        </div>
        <ol class="steps">
          <li><div class="card step"><span class="step__num" data-n="1" id="step-num-1" aria-hidden="true"></span><h3 data-i18n="how.s1.title"></h3><p data-i18n="how.s1.text"></p></div></li>
          <li><div class="card step"><span class="step__num" data-n="2" id="step-num-2" aria-hidden="true"></span><h3 data-i18n="how.s2.title"></h3><p data-i18n="how.s2.text"></p></div></li>
          <li><div class="card step"><span class="step__num" data-n="3" id="step-num-3" aria-hidden="true"></span><h3 data-i18n="how.s3.title"></h3><p data-i18n="how.s3.text"></p></div></li>
        </ol>
      </div>
    </section>

    <section class="section section--alt" id="start" aria-labelledby="dash-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="dash.eyebrow"></span>
          <h2 id="dash-title" data-i18n="dash.title"></h2>
          <p class="section__lead" data-i18n="dash.lead"></p>
        </div>
        <div class="card dashboard">
          <div class="dashboard__fields">
            <div class="field">
              <label class="field__label" for="sel-district" data-i18n="dash.district"></label>
              <select class="select" id="sel-district"></select>
            </div>
            <div class="field">
              <label class="field__label" for="sel-crop" data-i18n="dash.crop"></label>
              <select class="select" id="sel-crop"></select>
            </div>
          </div>
          <div class="dashboard__summary">
            <p class="muted" id="dash-summary" aria-live="polite"></p>
            <p class="small muted" data-i18n="dash.hint" data-i18n-real="dash.hintReal"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="climate" data-nav="nav.climate" aria-labelledby="climate-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="climate.eyebrow"></span>
          <h2 id="climate-title" data-i18n="climate.title"></h2>
          <p class="section__lead" id="climate-lead"></p>
        </div>
        <div class="notice" role="note"><span aria-hidden="true">!</span><p data-i18n="climate.demoNotice" data-i18n-real="climate.noticeReal"></p></div>
        <div class="grid" id="climate-cards" data-section-host="climate" style="margin-top:var(--s-4)"></div>

        <div class="section__head" style="margin-top:var(--s-6)">
          <h2 id="shift-title" data-i18n="shift.title"></h2>
          <p class="section__lead" id="shift-lead"></p>
        </div>
        <div class="shift-grid" id="climate-shift"></div>
      </div>
    </section>

    <section class="section section--alt" id="rotation" data-nav="nav.rotation" aria-labelledby="rot-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="rot.eyebrow"></span>
          <h2 id="rot-title" data-i18n="rot.title"></h2>
          <p class="section__lead" id="rot-lead"></p>
        </div>
        <div class="notice" role="note"><span aria-hidden="true">!</span><p data-i18n="rot.notice"></p></div>

        <div class="card prio-panel" style="margin-top:var(--s-4)">
          <div>
            <h3 id="prio-title" data-i18n="prio.title"></h3>
            <p class="muted" data-i18n="prio.lead"></p>
            <div id="rot-priorities"></div>
          </div>
          <div id="rot-fit" aria-live="polite"></div>
          <p class="small muted" data-i18n="prio.method"></p>
        </div>

        <div class="rot-grid" id="rot-cards" data-section-host="rotation" style="margin-top:var(--s-4)"></div>

        <h3 style="margin-top:var(--s-6)" data-i18n="tbl.title"></h3>
        <div id="rot-table"></div>
        <p class="small muted" data-i18n="tbl.legend"></p>

        <div class="card" style="margin-top:var(--s-6)">
          <h3 data-i18n="why.title"></h3>
          <div id="rot-why"></div>
        </div>
      </div>
    </section>

    <section class="section" id="sources" data-nav="nav.sources" aria-labelledby="src-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="src.eyebrow"></span>
          <h2 id="src-title" data-i18n="src.title"></h2>
          <p class="section__lead" data-i18n="src.lead" data-i18n-real="src.leadReal"></p>
        </div>
        <div class="notice" role="note"><span aria-hidden="true">!</span><p data-i18n="src.honesty" data-i18n-real="src.honestyReal"></p></div>
        <div class="notice notice--info" role="note" style="margin-top:var(--s-3)"><span aria-hidden="true">i</span><div><p><strong data-i18n="src.usTitle"></strong></p><p data-i18n="src.usText"></p></div></div>
        <div id="sources-list" data-section-host="sources" style="margin-top:var(--s-5)"></div>
      </div>
    </section>

    <section class="section section--alt" id="messages" data-nav="nav.messages" aria-labelledby="msg-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="msg.eyebrow"></span>
          <h2 id="msg-title" data-i18n="msg.title"></h2>
          <p class="section__lead" data-i18n="msg.lead"></p>
          <p class="cluster"><span class="badge badge--planned" data-i18n="msg.upcoming"></span><span class="small muted" data-i18n="msg.notice"></span></p>
        </div>
        <div class="msg-grid" id="msg-grid" data-section-host="messages"></div>
      </div>
    </section>

    <section class="section" id="about" data-nav="nav.about" aria-labelledby="about-title">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow" data-i18n="about.eyebrow"></span>
          <h2 id="about-title" data-i18n="about.title"></h2>
        </div>
        <div class="about-grid">
          <article class="card"><h3 data-i18n="about.mission.title"></h3><p data-i18n="about.mission.text"></p></article>
          <article class="card"><h3 data-i18n="about.challenge.title"></h3><p data-i18n="about.challenge.text"></p></article>
          <article class="card"><h3 data-i18n="about.data.title"></h3><p data-i18n="about.data.text" data-i18n-real="about.dataReal"></p></article>
          <article class="card"><h3 data-i18n="about.limits.title"></h3><p data-i18n="about.limits.text"></p></article>
          <article class="card"><h3 data-i18n="about.expert.title"></h3><p data-i18n="about.expert.text"></p></article>
          <article class="card"><h3 data-i18n="about.tech.title"></h3><p data-i18n="about.tech.text"></p></article>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer on-dark">
    <div class="container">
      <div class="footer__grid">
        <div>
          <h2 class="footer__title" data-i18n="footer.title"></h2>
          <ul class="status-list" id="footer-status"></ul>
        </div>
        <div>
          <p data-i18n="footer.disclaimer"></p>
        </div>
      </div>
      <p class="footer__legal" data-i18n="footer.challenge"></p>
    </div>
  </footer>

  <script src="src/data/demo-data.js"></script>
  <script src="src/utils/i18n.js"></script>
  <script src="src/data/nasa-power.js"></script>
  <script src="src/data/provider.js"></script>
  <script src="src/translations/common.js"></script>
  <script src="src/translations/climate.js"></script>
  <script src="src/translations/rotation.js"></script>
  <script src="src/translations/sources.js"></script>
  <script src="src/translations/nasa.js"></script>
  <script src="src/components/charts.js"></script>
  <script src="src/utils/scoring.js"></script>
  <script src="src/app.js"></script>
  <script src="src/sections/dashboard.js"></script>
  <script src="src/sections/climate.js"></script>
  <script src="src/sections/rotation.js"></script>
  <script src="src/sections/sources.js"></script>
  <script src="src/sections/messages.js"></script>
  <script src="src/sections/footer.js"></script>
</body>
</html>
